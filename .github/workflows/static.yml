<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наталье — 22 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--night:#24102f;--plum:#3b1b4d;--rose:#f27a9b;--apricot:#ffb88a;--lilac:#cdb4f6;--ivory:#fff6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--plum),var(--night) 65%) fixed;color:var(--ivory);
font:400 18px/1.7 Nunito,system-ui,sans-serif;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ivory);opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.08;transform:scale(.5)}}
main{position:relative;z-index:1}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
h1,h2{font-family:"Cormorant Garamond",serif;font-weight:500;margin:0}
.hello{font-size:clamp(22px,4.5vw,34px);font-style:italic;color:var(--apricot);margin-bottom:4px}
.name{font-size:clamp(54px,14vw,128px);font-weight:700;line-height:1;letter-spacing:.01em;color:var(--ivory)}
.age{display:flex;gap:clamp(8px,3vw,28px);margin:40px 0 16px;justify-content:center}
.dig{position:relative;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(150px,38vw,320px);line-height:.85;color:var(--rose);
text-shadow:0 0 60px rgba(242,122,155,.35)}
.flame{position:absolute;left:50%;top:-34px;width:22px;height:40px;margin-left:-11px;transform-origin:50% 100%;
background:radial-gradient(50% 60% at 50% 70%,#fff3c4 0 25%,var(--apricot) 55%,rgba(255,184,138,0) 72%);
border-radius:50% 50% 50% 50%/65% 65% 35% 35%;filter:blur(.4px) drop-shadow(0 0 18px var(--apricot));
animation:fl 1.1s ease-in-out infinite alternate;transition:opacity .5s,transform .5s}
.dig:nth-child(2) .flame{animation-delay:-.5s}
@keyframes fl{from{transform:rotate(-4deg) scaleY(.94)}to{transform:rotate(4deg) scaleY(1.08)}}
.out .flame{opacity:0;transform:scale(.2) translateY(-20px);animation:none}
.out .smoke{opacity:1}
.smoke{position:absolute;left:50%;top:-70px;width:2px;height:60px;margin-left:-1px;opacity:0;background:linear-gradient(transparent,rgba(255,246,236,.5));filter:blur(3px);transition:opacity 1.2s .3s}
button{font:600 18px Nunito,sans-serif;color:var(--night);background:linear-gradient(135deg,var(--apricot),var(--rose));border:0;border-radius:999px;
padding:16px 34px;cursor:pointer;margin-top:28px;box-shadow:0 10px 40px rgba(242,122,155,.35);transition:transform .2s}
button:hover{transform:translateY(-2px) scale(1.03)}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:4px}
.hint{font-size:15px;color:var(--lilac);margin-top:14px;opacity:.85}
.wishes{max-width:640px;margin:0 auto}
.wishes h2{font-size:clamp(34px,7vw,56px);color:var(--apricot);margin-bottom:36px}
.wish{font-family:"Cormorant Garamond",serif;font-size:clamp(22px,4.6vw,30px);line-height:1.4;margin:0 0 30px;padding:0 4px}
.wish:nth-of-type(odd){text-align:left;color:var(--ivory)}
.wish:nth-of-type(even){text-align:right;color:var(--lilac);font-style:italic}
.sign{font-family:"Marck Script",cursive;font-size:clamp(34px,7vw,52px);color:var(--rose);margin-top:24px}
.final{font-size:15px;color:var(--lilac);opacity:.7;margin-top:8px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px)}
.aurora b{position:absolute;border-radius:50%;width:50vmax;height:50vmax;animation:dr 18s ease-in-out infinite alternate}
.aurora b:nth-child(1){background:#f27a9b;left:-10%;top:-10%;opacity:.4}
.aurora b:nth-child(2){background:#7a4cd6;right:-10%;top:20%;animation-delay:-6s;opacity:.5}
.aurora b:nth-child(3){background:#ffb88a;left:20%;bottom:-25%;animation-delay:-11s;opacity:.28}
@keyframes dr{to{transform:translate(8vw,6vh) scale(1.2)}}
.name{background:linear-gradient(100deg,#fff6ec 30%,#ffb88a 46%,#f27a9b 54%,#fff6ec 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s ease-in-out infinite alternate}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.age{transition:transform .2s ease-out}
.balloon{position:fixed;bottom:-130px;width:56px;height:70px;border-radius:50% 50% 48% 48%;z-index:2;cursor:pointer;animation:up linear forwards;box-shadow:inset -6px -8px 14px rgba(0,0,0,.15)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(255,246,236,.4)}
@keyframes up{to{transform:translate(var(--dx),-125vh) rotate(8deg)}}
.gift{font-size:clamp(110px,30vw,190px);line-height:1;cursor:pointer;user-select:none;animation:wob 2.5s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(242,122,155,.5))}
.gift:focus-visible{outline:3px solid var(--lilac);outline-offset:8px;border-radius:24px}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) scale(1.06)}}
.coupon{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(24px,5vw,34px);line-height:1.35;max-width:560px;min-height:3.2em;margin:24px 0 0;padding:22px 28px;color:var(--apricot);border:2px dashed var(--lilac);border-radius:22px;display:flex;align-items:center;justify-content:center}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s}
.reveal.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<canvas id="cv" aria-hidden="true"></canvas>
<main>
<section id="top">
  <div class="hello">С днём рождения,</div>
  <h1 class="name">Наталья</h1>
  <div class="age" id="age" aria-label="22 года">
    <div class="dig">2<span class="flame"></span><span class="smoke"></span></div>
    <div class="dig">2<span class="flame"></span><span class="smoke"></span></div>
  </div>
  <button id="btn" type="button">Задуть свечи</button>
  <div class="hint" id="hint">Загадай желание и нажми на кнопку</div>
</section>

<section id="wishes">
  <div class="wishes">
    <h2 class="reveal">Тебе двадцать два — и это только начало</h2>
    <p class="wish reveal">Пусть каждый новый день будет похож на хороший подарок: неожиданный и именно тот, о котором мечталось.</p>
    <p class="wish reveal">Пусть рядом будут люди, с которыми можно смеяться до слёз и молчать без неловкости.</p>
    <p class="wish reveal">Пусть смелые планы не остаются в блокноте, а сбываются — один за другим.</p>
    <p class="wish reveal">Пусть внутри всегда живёт тот самый огонёк, который сегодня так красиво горел на свечах.</p>
    <p class="wish reveal">И пусть двадцать два станет твоим самым светлым, лёгким и счастливым годом.</p>
    <div class="sign reveal">С любовью и теплом ♡</div>
    <div class="final reveal">Нажми на «22» — и праздник вернётся</div>
  </div>
</section>

<section id="giftsec">
  <h2 class="reveal" style="font-size:clamp(34px,7vw,56px);color:var(--apricot)">И ещё кое-что для тебя</h2>
  <div class="gift" id="gift" role="button" tabindex="0" aria-label="Открыть подарок">🎁</div>
  <p class="coupon" id="coupon" aria-live="polite">Нажми на подарок — внутри купон</p>
</section>
</main>
<script>
(function(){
  var st=document.getElementById('stars');
  for(var i=0;i<70;i++){var s=document.createElement('i');
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(3+Math.random()*3)+'s';st.appendChild(s);}
  var cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=[],run=false;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size();addEventListener('resize',size);
  var cols=['#f27a9b','#ffb88a','#cdb4f6','#fff6ec','#ffd86b'];
  function burst(x,y){
    var calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
    for(var i=0;i<(calm?30:170);i++){
      var a=Math.random()*Math.PI*2,v=6+Math.random()*10;
      P.push({x:x||innerWidth/2,y:y||innerHeight*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,
        w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:cols[i%cols.length],l:1});
    }
    if(!run){run=true;requestAnimationFrame(tick)}
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    P=P.filter(function(p){return p.l>0&&p.y<cv.height+20});
    P.forEach(function(p){
      p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.004;
      cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);
      cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(P.length)requestAnimationFrame(tick);else run=false;
  }
  var age=document.getElementById('age'),btn=document.getElementById('btn'),hint=document.getElementById('hint');
  function toggle(){
    var out=age.classList.toggle('out');
    if(out){
      burst();setTimeout(burst,350);melody();balloons();
      btn.textContent='Зажечь снова';hint.textContent='Пусть всё загаданное сбудется ✨';
      setTimeout(function(){document.getElementById('wishes').scrollIntoView({behavior:'smooth'})},1400);
    }else{btn.textContent='Задуть свечи';hint.textContent='Загадай желание и нажми на кнопку';}
  }
  btn.addEventListener('click',toggle);
  document.addEventListener('click',function(e){if(e.target.closest('button,.gift,.balloon'))return;burst(e.clientX,e.clientY)});
  var lt=0;
  document.addEventListener('pointermove',function(e){
    var n=Date.now();
    if(n-lt>35){lt=n;P.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*2,vy:-Math.random()*1.5,w:3,h:3,r:0,vr:.1,c:'#ffd86b',l:.5});if(!run){run=true;requestAnimationFrame(tick)}}
    var dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;
    age.style.transform='perspective(800px) rotateY('+dx*14+'deg) rotateX('+(-dy*14)+'deg)';
  });
  function balloons(){
    var c=['#f27a9b','#ffb88a','#cdb4f6','#ffd86b','#8fd3c8'];
    for(var i=0;i<14;i++)(function(i){
      var b=document.createElement('div');b.className='balloon';
      b.style.cssText='left:'+(Math.random()*92)+'%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),'+c[i%5]+' 60%);animation-duration:'+(8+Math.random()*7)+'s;animation-delay:'+(Math.random()*2)+'s;--dx:'+((Math.random()-.5)*20)+'vw';
      b.addEventListener('click',function(){var r=b.getBoundingClientRect();burst(r.left+28,r.top+30);b.remove()});
      b.addEventListener('animationend',function(){b.remove()});
      document.body.appendChild(b);
    })(i);
  }
  function melody(){
    try{
      var A=new (window.AudioContext||window.webkitAudioContext)(),t=A.currentTime+.1;
      var n=[[261.6,.75],[261.6,.25],[293.7,1],[261.6,1],[349.2,1],[329.6,2],[261.6,.75],[261.6,.25],[293.7,1],[261.6,1],[392,1],[349.2,2],[261.6,.75],[261.6,.25],[523.3,1],[440,1],[349.2,1],[329.6,1],[293.7,1.5],[466.2,.75],[466.2,.25],[440,1],[349.2,1],[392,1],[349.2,2]];
      n.forEach(function(x){
        var o=A.createOscillator(),g=A.createGain(),d=x[1]*.5;
        o.type='triangle';o.frequency.value=x[0];
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);
        o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d+.05);t+=d;
      });
    }catch(e){}
  }
  var cp=['Купон на день, когда от тебя никто ничего не требует','Купон на самый вкусный десерт — выбираешь ты','Купон на одну исполненную мечту, даже самую смелую','Купон на вечер с любимым фильмом и тёплым пледом','Купон на тысячу комплиментов (срок действия — вечно)','Купон на спонтанную поездку в любое место','Купон на отличное настроение без всякой причины'];
  var gf=document.getElementById('gift'),last=-1;
  function openGift(){
    var k;do{k=Math.floor(Math.random()*cp.length)}while(k===last);last=k;
    document.getElementById('coupon').textContent=cp[k];
    var r=gf.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
  }
  gf.addEventListener('click',openGift);
  gf.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});
  var io=new IntersectionObserver(function(es){es.forEach(function(e,i){
    if(e.isIntersecting){setTimeout(function(){e.target.classList.add('on')},i*150);io.unobserve(e.target)}})},{threshold:.3});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
